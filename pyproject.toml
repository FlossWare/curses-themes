[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curses-tui"
version = "0.14"
description = "Lightweight terminal UI and theme support for Python curses applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "FlossWare", email = "scot.floess@gmail.com"}]
maintainers = [{name = "FlossWare", email = "scot.floess@gmail.com"}]
keywords = ["curses", "themes", "terminal", "tui", "ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
requires-python = ">=3.9"
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
windows = ["windows-curses; sys_platform == 'win32'"]
dev = [
    "pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0", "pytest-mock>=3.10.0", "coverage[toml]>=7.0.0",
    "radon>=5.1.0", "xenon>=0.9.0", "black>=23.0.0", "isort>=5.12.0",
    "ruff>=0.1.0", "flake8>=6.0.0", "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.10.0", "flake8-simplify>=0.20.0", "pylint>=2.17.0",
    "mypy>=1.0.0", "bandit>=1.7.5", "safety>=2.3.0", "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0", "build>=0.10.0", "wheel>=0.40.0", "setuptools>=65.0.0",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/FlossWare/curses-tui"
Repository = "https://github.com/FlossWare/curses-tui"
Documentation = "https://github.com/FlossWare/curses-tui/blob/main/README.md"
"Bug Tracker" = "https://github.com/FlossWare/curses-tui/issues"

[tool.setuptools]
packages = ["curses_tui", "curses_tui.themes"]

[tool.setuptools.package-data]
curses_tui = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "venv", "__pycache__", "build", "dist", "htmlcov"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PL", "RUF"]
ignore = [
    "E501", "PLR0913", "PLR2004", "PLC0415", "E402", "RUF002", "B904",
    "SIM108", "PLR0912", "PLR0915", "RUF012", "I001", "RUF022", "UP037",
    "UP035", "C416", "RUF005", "SIM105", "PLR0911", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"examples/**/*.py" = ["T201"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["curses_tui"]
skip_glob = ["*/htmlcov/*", "*/.venv/*", "*/build/*", "*/dist/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
disable_error_code = ["no-any-return", "arg-type", "assignment", "unused-ignore"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "htmlcov", "build", "dist"]
skips = ["B101", "B405", "B314", "B110"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "tests/*"]

[tool.coverage.run]
source = ["curses_tui"]
omit = ["*/tests/*", "*/test_*", "*/examples/*", "*/__pycache__/*", "*/site-packages/*", "*/.venv/*", "*/venv/*"]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover", "def __repr__", "def __str__", "raise AssertionError",
    "raise NotImplementedError", "if __name__ == .__main__:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod", "except ImportError:",
    "if typing.TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--verbose", "--strict-markers", "--strict-config", "--cov=curses_tui", "--cov-report=xml", "--cov-report=term-missing:skip-covered", "--cov-report=html", "--cov-branch", "--cov-fail-under=82", "--maxfail=3"]
markers = ["slow: marks tests as slow (deselect with -m not slow)", "integration: marks tests as integration tests", "unit: marks tests as unit tests"]
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
timeout = 300

[tool.pylint.main]
py-version = "3.9"
ignore-paths = ["tests", "examples", ".venv", "build", "dist"]

[tool.pylint.messages_control]
disable = ["C0111", "C0103", "R0903", "R0913", "W0212"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-branches = 15
max-locals = 20
max-returns = 8
max-statements = 60
