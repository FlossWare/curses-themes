[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curses-themes"
version = "0.1.0"
description = "Lightweight theme support for Python curses applications"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "FlossWare", email = "scot.floess@gmail.com"}
]
maintainers = [
    {name = "FlossWare", email = "scot.floess@gmail.com"}
]
keywords = ["curses", "themes", "terminal", "tui", "ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.10.0",
    # Coverage
    "coverage[toml]>=7.0.0",
    # Code Quality
    "radon>=5.1.0",
    "xenon>=0.9.0",
    # Formatting
    "black>=23.0.0",
    "isort>=5.12.0",
    # Linting
    "ruff>=0.1.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.10.0",
    "flake8-simplify>=0.20.0",
    "pylint>=2.17.0",
    # Type Checking
    "mypy>=1.0.0",
    # Security
    "bandit>=1.7.5",
    "safety>=2.3.0",
    # Documentation
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    # Build
    "build>=0.10.0",
    "wheel>=0.40.0",
    "setuptools>=65.0.0",
]

[project.urls]
Homepage = "https://github.com/FlossWare/curses-themes"
Repository = "https://github.com/FlossWare/curses-themes"
Documentation = "https://github.com/FlossWare/curses-themes/blob/main/README.md"
"Bug Tracker" = "https://github.com/FlossWare/curses-themes/issues"

[tool.setuptools]
packages = ["curses_themes", "curses_themes.themes"]

[tool.setuptools.package-data]
curses_themes = ["py.typed"]

# Ruff Configuration (Modern Python Linter)
[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # magic values ok in tests
    "S101",     # assert allowed in tests
]
"examples/**/*.py" = [
    "T201",     # print allowed in examples
]

# Black Configuration
[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
)/
'''

# isort Configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["curses_themes"]
skip_glob = ["*/htmlcov/*", "*/.venv/*", "*/build/*", "*/dist/*"]

# MyPy Configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

# Bandit Configuration (Security)
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "htmlcov",
    "build",
    "dist",
]
skips = [
    "B101",  # assert_used - OK in tests
]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "tests/*"]

# Coverage Configuration
[tool.coverage.run]
source = ["curses_themes"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/examples/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
    "if typing.TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=curses_themes",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-branch",
    "--cov-fail-under=85",
    "--maxfail=3",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
timeout = 300

# Pylint Configuration
[tool.pylint.main]
py-version = "3.9"
ignore-paths = [
    "tests",
    "examples",
    ".venv",
    "build",
    "dist",
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0212",  # protected-access (useful in tests)
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-branches = 15
max-locals = 20
max-returns = 8
max-statements = 60