name: Normalize package imports

on:
  push:
    branches: [cleanup/remove-legacy-import-workaround]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale package references in tracked source
        run: |
          grep -RIl 'curses_themes' tests examples tools --include='*.py' | xargs -r sed -i 's/curses_themes/curses_tui/g'
          grep -RIl 'curses-themes repo root' tests examples tools --include='*.py' | xargs -r sed -i 's/curses-themes repo root/curses-tui repo root/g'
      - name: Commit normalized imports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests examples tools
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove stale curses_themes imports [skip ci]'
          git push