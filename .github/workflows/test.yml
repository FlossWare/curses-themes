name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        include:
          - os: windows-latest
            python-version: '3.12'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install windows-curses (Windows only)
        if: runner.os == 'Windows'
        run: pip install windows-curses

      - name: Run tests
        run: pytest --tb=short -q

  validate-themes:
    name: Validate Java themes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout curses-themes
        uses: actions/checkout@v4

      - name: Checkout curses-java themes (sibling directory)
        uses: actions/checkout@v4
        with:
          repository: FlossWare/curses-java
          path: ../curses-java

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Java JSON themes load correctly
        run: pytest tests/test_config_theme.py -k "Java" -v --tb=short

      - name: Check for schema drift
        run: |
          python3 -c "
          import json, sys

          schema = json.load(open('../curses-java/themes/schema.json'))

          # Keys the Python adapter knows how to handle
          KNOWN_COLOR_KEYS = {'background', 'button', 'button_focused', 'text_input', 'border', 'selection', 'disabled'}
          KNOWN_3D_KEYS = {'shadow_color', 'highlight_color', 'lowlight_color', 'shadow_offset', 'rendering_style'}

          # Check colors
          schema_color_keys = set(schema['properties']['colors']['required'])
          unknown_colors = schema_color_keys - KNOWN_COLOR_KEYS
          if unknown_colors:
              print(f'DRIFT DETECTED: schema requires color keys unknown to Python adapter: {unknown_colors}')
              sys.exit(1)

          # Check 3D keys if present
          if '3d' in schema.get('properties', {}):
              td_props = schema['properties']['3d']
              if 'required' in td_props:
                  schema_3d_keys = set(td_props['required'])
                  unknown_3d = schema_3d_keys - KNOWN_3D_KEYS
                  if unknown_3d:
                      print(f'DRIFT DETECTED: schema requires 3D keys unknown to Python adapter: {unknown_3d}')
                      sys.exit(1)

          print('Schema drift check passed -- all required fields are handled by the Python adapter')
          "
